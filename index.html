<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mesa Hexa</title>
  
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%231a1a2e' stroke='%23d4af37' stroke-width='3'/><text x='50' y='65' text-anchor='middle' font-size='40' fill='%23d4af37'>🎲</text></svg>">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%231a1a2e'/><text x='50' y='65' text-anchor='middle' font-size='45' fill='%23d4af37'>🎲</text></svg>">
  <meta name="theme-color" content="#1a1a2e">
  
  <link rel="stylesheet" href="css/estilo.css">
  <script src="js/app.js"></script>
</head>
<body>

<header>
  <h1>🎲 Mesa Hexa</h1>
</header>

<main class="conteudo">

  <div class="painel-esquerdo">

    <div class="caixa-entrada">
      <h2>Bem-vindo ao Mesa Hexa!</h2>
      <label for="nome-jogador">Seu nome / personagem:</label>
      <input type="text" id="nome-jogador" placeholder="Digite seu nome..." maxlength="20">
      <button id="btn-entrar">Entrar na Mesa</button>
      <p id="status-mesa" class="status-aguardando">Aguardando entrada...</p>
    </div>

    <div class="rolador-dados">
      <h3>Rolagem Rápida</h3>
      <div class="botoes-dados">
        <button class="btn-dado" data-tipo="d4">d4</button>
        <button class="btn-dado" data-tipo="d6">d6</button>
        <button class="btn-dado" data-tipo="d8">d8</button>
        <button class="btn-dado" data-tipo="d10">d10</button>
        <button class="btn-dado" data-tipo="d12">d12</button>
        <button class="btn-dado" data-tipo="d20">d20</button>
        <button class="btn-dado" data-tipo="d100">d100</button>
      </div>

      <div class="expressao-personalizada">
        <label>Expressão:</label>
        <input type="text" id="expressao" placeholder="ex: 1d20+3">
        <button id="btn-rolar">ROLAR!</button>
      </div>

      <div id="resultado" class="resultado"></div>
    </div>

    <div class="painel-tokens">
      <h3>🎯 Tokens — D&D 5e</h3>
      
      <!-- 🦸 CLASSES DE HERÓIS -->
      <div class="categoria-tokens">
        <h4>🦸 Heróis — Classes</h4>
        <div class="lista-tokens">
          <button class="token heroi" data-nome="Bárbaro" data-icone="💪">💪 Bárbaro</button>
          <button class="token heroi" data-nome="Bardo" data-icone="🎵">🎵 Bardo</button>
          <button class="token heroi" data-nome="Bruxo" data-icone="🔮">🔮 Bruxo</button>
          <button class="token heroi" data-nome="Clérigo" data-icone="✝️">✝️ Clérigo</button>
          <button class="token heroi" data-nome="Druida" data-icone="🌿">🌿 Druida</button>
          <button class="token heroi" data-nome="Feiticeiro" data-icone="✨">✨ Feiticeiro</button>
          <button class="token heroi" data-nome="Guerreiro" data-icone="⚔️">⚔️ Guerreiro</button>
          <button class="token heroi" data-nome="Ladino" data-icone="🗡️">🗡️ Ladino</button>
          <button class="token heroi" data-nome="Mago" data-icone="📖">📖 Mago</button>
          <button class="token heroi" data-nome="Monge" data-icone="👊">👊 Monge</button>
          <button class="token heroi" data-nome="Paladino" data-icone="🛡️">🛡️ Paladino</button>
          <button class="token heroi" data-nome="Ranger" data-icone="🏹">🏹 Ranger</button>
        </div>
      </div>

      <!-- 👹 INIMIGOS — BESTIÁRIO D&D 5e -->
      <div class="categoria-tokens">
        <h4>👹 Inimigos — Bestiário</h4>
        <div class="lista-tokens">
          <button class="token inimigo" data-nome="Aberração" data-icone="🐙">🐙 Aberração</button>
          <button class="token inimigo" data-nome="Beholder" data-icone="👁️">👁️ Beholder</button>
          <button class="token inimigo" data-nome="Carrasco" data-icone="💀">💀 Carrasco</button>
          <button class="token inimigo" data-nome="Demônio" data-icone="👿">👿 Demônio</button>
          <button class="token inimigo" data-nome="Diabo" data-icone="😈">😈 Diabo</button>
          <button class="token inimigo" data-nome="Dragão" data-icone="🐉">🐉 Dragão</button>
          <button class="token inimigo" data-nome="Esqueleto" data-icone="🦴">🦴 Esqueleto</button>
          <button class="token inimigo" data-nome="Fantasma" data-icone="👻">👻 Fantasma</button>
          <button class="token inimigo" data-nome="Goblin" data-icone="👺">👺 Goblin</button>
          <button class="token inimigo" data-nome="Hobgoblin" data-icone="👹">👹 Hobgoblin</button>
          <button class="token inimigo" data-nome="Kobold" data-icone="🦎">🦎 Kobold</button>
          <button class="token inimigo" data-nome="Lich" data-icone="🧙‍♂️">🧙‍♂️ Lich</button>
          <button class="token inimigo" data-nome="Lobo" data-icone="🐺">🐺 Lobo</button>
          <button class="token inimigo" data-nome="Manticora" data-icone="🦂">🦂 Mantícora</button>
          <button class="token inimigo" data-nome="Orc" data-icone="👹">👹 Orc</button>
          <button class="token inimigo" data-nome="Ogro" data-icone="👹">👹 Ogro</button>
          <button class="token inimigo" data-nome="Revenant" data-icone="⚰️">⚰️ Revenant</button>
          <button class="token inimigo" data-nome="Troll" data-icone="👹">👹 Troll</button>
          <button class="token inimigo" data-nome="Vampiro" data-icone="🧛">🧛 Vampiro</button>
          <button class="token inimigo" data-nome="Zumbi" data-icone="🧟">🧟 Zumbi</button>
        </div>
      </div>
      <div class="categoria-tokens">
        <h4>🌳 Naturais</h4>
        <div class="lista-tokens">
          <button class="token natural" data-nome="Árvore" data-icone="🌳">🌳 Árvore</button>
          <button class="token natural" data-nome="Pedra" data-icone="🪨">🪨 Pedra</button>
          <button class="token natural" data-nome="Água" data-icone="💧">💧 Água</button>
          <button class="token natural" data-nome="Fogo" data-icone="🔥">🔥 Fogo</button>
          <button class="token natural" data-nome="Planta" data-icone="🌿">🌿 Planta</button>
          <button class="token natural" data-nome="Caverna" data-icone="🕳️">🕳️ Caverna</button>
        </div>
      </div>

      <div class="categoria-tokens">
        <h4>🏗️ Artificiais</h4>
        <div class="lista-tokens">
          <button class="token artificial" data-nome="Parede" data-icone="🧱">🧱 Parede</button>
          <button class="token artificial" data-nome="Baú" data-icone="📦">📦 Baú</button>
          <button class="token artificial" data-nome="Porta" data-icone="🚪">🚪 Porta</button>
          <button class="token artificial" data-nome="Armadilha" data-icone="⚠️">⚠️ Armadilha</button>
          <button class="token artificial" data-nome="Torre" data-icone="🏰">🏰 Torre</button>
          <button class="token artificial" data-nome="Estátua" data-icone="🗿">🗿 Estátua</button>
        </div>
      </div>

      <div class="categoria-tokens">
        <h4>⭐ Objetos & Marcadores</h4>
        <div class="lista-tokens">
          <button class="token objeto" data-nome="Tesouro" data-icone="💰">💰 Tesouro</button>
          <button class="token objeto" data-nome="Poção" data-icone="🧪">🧪 Poção</button>
          <button class="token objeto" data-nome="Arma" data-icone="⚔️">⚔️ Arma</button>
          <button class="token objeto" data-nome="Chave" data-icone="🗝️">🗝️ Chave</button>
          <button class="token objeto" data-nome="Marcador" data-icone="📍">📍 Marcador</button>
          <button class="token objeto" data-nome="Foco" data-icone="🔴">🔴 Alvo</button>
        </div>
      </div>
    </div>

    <div class="historico">
      <h4>📜 Histórico</h4>
      <div id="lista-historico"></div>
    </div>
  </div>

  <div class="area-mapa" id="area-mapa">
    <div class="botoes-mapa">
      <button id="btn-limpar-mapa" class="btn-limpar">🗑️ Limpar Mapa</button>
    </div>
    <div class="grade-hexa" id="grade-hexa"></div>
  </div>

</main>
</body>
</html>
